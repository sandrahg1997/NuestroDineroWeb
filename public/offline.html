<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sin conexión · OurMoney</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(150deg, #fbf8ff 0, #f7f5fb 42%, #fff5fa 100%); color: #24212b; }
  .card { width: min(400px, 100%); background: #fff; border: 1px solid #e8e3ee; border-radius: 24px;
    padding: 32px; text-align: center; box-shadow: 0 12px 35px rgba(60,34,80,.08); }
  .mark { width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 16px; display: grid; place-items: center;
    color: #fff; background: linear-gradient(135deg, #9c4dcc, #ec4f9f); font-size: 26px; font-weight: 800; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #746f7d; margin: 0 0 20px; line-height: 1.5; }
  button { border: 0; border-radius: 12px; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer;
    color: #fff; background: linear-gradient(135deg, #9c4dcc, #ec4f9f); }
  @media (prefers-color-scheme: dark) {
    body { background: #17131f; color: #ece9f1; }
    .card { background: #1e1929; border-color: #2a2438; }
    p { color: #a49dad; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">O</div>
    <h1>Sin conexión</h1>
    <p>No hemos podido cargar OurMoney. Revisa tu conexión a internet e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
