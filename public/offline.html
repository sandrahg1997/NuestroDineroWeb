<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sin conexión · OurMoney</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: #faf8f5; color: #241a2b; }
  .card { width: min(400px, 100%); background: #fff; border: 1px solid #ebe5e8; border-radius: 24px;
    padding: 32px; text-align: center; box-shadow: 0 12px 35px rgba(60,34,80,.08); }
  .mark { width: 54px; height: 54px; margin: 0 auto 18px; border-radius: 16px; display: grid; place-items: center;
    color: #fff8ec; background: linear-gradient(180deg, #4b1a64, #2a1038); font-size: 26px; font-weight: 700; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #756c7c; margin: 0 0 20px; line-height: 1.5; }
  button { border: 0; border-radius: 12px; padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer;
    color: #fff8ec; background: linear-gradient(180deg, #4b1a64, #2a1038); }
  @media (prefers-color-scheme: dark) {
    body { background: #150d1b; color: #f3eef5; }
    .card { background: #1f1527; border-color: #33263d; }
    p { color: #a99cb3; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">O</div>
    <h1>Sin conexión</h1>
    <p>No hemos podido cargar OurMoney. Revisa tu conexión a internet e inténtalo de nuevo.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
