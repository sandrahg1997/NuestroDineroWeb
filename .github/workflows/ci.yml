name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Valores ficticios: el build no llama a Supabase, solo necesita que las
      # variables existan para no fallar al leerlas. No son secretos.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Tipos (tsc)
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build (Next.js)
        run: npm run build
